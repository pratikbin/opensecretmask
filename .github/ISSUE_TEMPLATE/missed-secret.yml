name: A secret was not masked
description: osm let a credential through on a channel it should have caught.
labels: [detection]
body:
  - type: markdown
    attributes:
      value: |
        **If this is a live credential of yours, rotate it first.**

        Never paste a real secret here. Replace every character of the value
        with a same-class stand-in so the *shape* survives: `sk-ant-api03-AAA…`.
        The shape is what we need; the value is not.

        If the leak is a whole channel rather than one vendor's format — a hook
        that does not fire, a field that reaches the model unmasked — report it
        privately instead: see SECURITY.md.
  - type: input
    id: vendor
    attributes:
      label: Vendor or credential kind
      placeholder: Fly.io deploy token
    validations:
      required: true
  - type: textarea
    id: shape
    attributes:
      label: The shape, with every character replaced
      render: text
      placeholder: FlyV1 fm2_AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
    validations:
      required: true
  - type: dropdown
    id: channel
    attributes:
      label: Where did it pass through unmasked?
      options:
        - A tool result (the model read it)
        - My prompt
        - A subagent
        - A compaction summary
        - Somewhere else / not sure
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: What you ran, what you expected, what you saw. `/osm-secrets` output with values elided is useful.
  - type: input
    id: version
    attributes:
      label: osm and Claude Code versions
      placeholder: osm 0.1.0, Claude Code 2.1.272
