# golangci-lint v2 config. Requires golangci-lint v2.6.0+ (the `modernize`
# linter is unavailable on v1). Install: go install
# github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
version: "2"

linters:
  default: standard
  enable:
    - modernize
  exclusions:
    generated: lax

formatters:
  enable:
    - gofmt
    - goimports
