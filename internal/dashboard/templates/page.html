{{define "page"}}<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>opensecretmask</title>
    <link rel="stylesheet" href="/assets/dashboard.css" />
    <script src="/assets/htmx.min.js"></script>
    <script>
      document.addEventListener('htmx:beforeSwap', function() {
        var el = document.getElementById('detail-body');
        if (el) window._osmScroll = el.scrollTop;
      });
      document.addEventListener('htmx:afterSettle', function() {
        var el = document.getElementById('detail-body');
        if (el && window._osmScroll) { el.scrollTop = window._osmScroll; window._osmScroll = 0; }
      });
    </script>
  </head>
  <body class="h-screen flex flex-col overflow-hidden bg-base-300 text-base-content">
    {{.}}
  </body>
</html>
{{end}}
