version: 2
project_name: osm

before:
  hooks:
    - go mod tidy

builds:
  - id: osm
    main: ./cmd/osm
    binary: osm
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.Version={{.Version}}
    goos: [linux, darwin]
    goarch: [amd64, arm64]

archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

sboms:
  - artifacts: archive

release:
  draft: false
  prerelease: auto

snapshot:
  version_template: "{{ .Tag }}-next"
