# Pre-commit hooks.
# Install: `pre-commit install`
# Run on all files: `pre-commit run --all-files`

repos:
  # ---------- generic ----------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: mixed-line-ending

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  # ---------- Go ----------
  - repo: https://github.com/golangci/golangci-lint
    rev: v2.12.2
    hooks:
      - id: golangci-lint
        args: [--config=.golangci.yml]
        pass_filenames: false

  - repo: https://github.com/tekwizely/pre-commit-golang
    rev: v1.0.0-rc.4
    hooks:
      - id: go-mod-tidy
      - id: go-build-mod
      - id: go-vet-mod

  - repo: local
    hooks:
      - id: go-test-unit
        name: go test (unit)
        entry: bash -c 'go test -race ./cmd/... ./internal/...'
        language: system
        pass_filenames: false
        files: '\.go$'

      - id: go-fix
        name: go fix
        entry: bash -c 'go fix ./...'
        language: system
        pass_filenames: false
        files: '\.go$'

      - id: gosec
        name: gosec
        entry: bash -c 'command -v gosec >/dev/null || go install github.com/securego/gosec/v2/cmd/gosec@latest; gosec -no-fail ./...'
        language: system
        pass_filenames: false
        files: '\.go$'

  # ---------- dashboard TS/JS ----------
  - repo: local
    hooks:
      - id: oxlint
        name: oxlint
        entry: bash -c 'cd internal/dashboard && bunx oxlint'
        language: system
        files: '^internal/dashboard/.*\.(ts|tsx|js|jsx|mjs)$'
        pass_filenames: false
      - id: oxfmt
        name: oxfmt
        entry: bash -c 'cd internal/dashboard && bunx oxfmt $(for f in "$@"; do printf "%s " "${f#internal/dashboard/}"; done)' --
        language: system
        files: '^internal/dashboard/.*\.(ts|tsx|js|jsx|mjs|json)$'
        pass_filenames: true
